[project]
name = "mcp-anki"
version = "0.1.0"
description = "MCP server for creating and editing Anki notes and deck limits via AnkiConnect"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.27.1",
    "pydantic>=2",
]

[project.scripts]
mcp-anki = "mcp_anki.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_anki"]
